<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#363636" />
    <meta
      name="description"
      content="Matt Wellman — Senior Software Engineer at Fabletics. Architected the real-time inventory platform across 159 retail stores and built the Fabletics FIT app to 548k downloads worldwide."
    />

    <!-- Social scrapers don't execute JavaScript, so share metadata must be
         static here rather than injected at runtime. -->
    <link rel="canonical" href="https://mattwellman.info/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matt Wellman" />
    <meta property="og:title" content="Matt Wellman — Senior Software Engineer" />
    <meta
      property="og:description"
      content="Senior Software Engineer at Fabletics — architected the real-time inventory platform across 159 retail stores and built the Fabletics FIT app to 548k downloads worldwide."
    />
    <meta property="og:url" content="https://mattwellman.info/" />
    <meta property="og:image" content="https://mattwellman.info/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Matt Wellman — Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="Senior Software Engineer at Fabletics — architected the real-time inventory platform across 159 retail stores and built the Fabletics FIT app to 548k downloads worldwide."
    />
    <meta name="twitter:image" content="https://mattwellman.info/og-image.jpg" />

    <link rel="apple-touch-icon" href="/favicon32.png" />

    <link
      href="https://fonts.googleapis.com/css?family=Piazzolla:wght@200;400|Dr+Sugiyama|Cinzel+Decorative:wght@400;700|Tenor+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />

    <!-- Person structured data — helps Google recognize "Matt Wellman" as this
         specific entity (a software engineer at Fabletics) rather than any of
         the other people who share the name. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Matt Wellman",
        "url": "https://mattwellman.info/",
        "image": "https://mattwellman.info/og-image.jpg",
        "jobTitle": "Senior Software Engineer",
        "worksFor": {
          "@type": "Organization",
          "name": "Fabletics"
        },
        "sameAs": [
          "https://www.linkedin.com/in/matt-wellman-154301a3",
          "https://github.com/Mass812"
        ]
      }
    </script>

    <title>Matt Wellman</title>
  </head>

    <noscript>Thank You for looking into this codebase :).</noscript>
    <div id="root"></div>
